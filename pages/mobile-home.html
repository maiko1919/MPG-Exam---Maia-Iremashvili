<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Mobile - Home</title>
  <link rel="icon" href="../assets/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../assets/styles/style.css">
</head>
<body style="background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <!-- Smartphone Frame -->
  <div style="width: 390px; height: 844px; background-color: #121212; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 8px solid #282828; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">

    <!-- Mobile Content Viewport -->
    <div style="flex-grow: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px;">
      
      <!-- Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #ff0055, #7a00ff); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 0.85rem;">J</div>
          <span style="background-color: #242424; color: #fff; padding: 6px 14px; border-radius: 500px; font-size: 0.75rem; font-weight: 600;">Music</span>
          <span style="background-color: #242424; color: #fff; padding: 6px 14px; border-radius: 500px; font-size: 0.75rem; font-weight: 600;">Podcasts</span>
        </div>
      </div>

      <!-- Quick Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px;">
        <div style="background-color: #2a2a2a; border-radius: 6px; display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer;" onclick="window.location.href='playlist.html'">
          <img src="../assets/img/covers/small_cover.png" alt="" style="width: 48px; height: 48px; object-fit: cover;">
          <span style="color: #fff; font-size: 0.75rem; font-weight: 700;">Get Lucky Mix</span>
        </div>
        <div style="background-color: #2a2a2a; border-radius: 6px; display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer;" onclick="window.location.href='playlist.html'">
          <img src="../assets/img/albums/album_1.png" alt="" style="width: 48px; height: 48px; object-fit: cover;">
          <span style="color: #fff; font-size: 0.75rem; font-weight: 700;">Daily Mix 1</span>
        </div>
      </div>

      <!-- Made For You -->
      <h3 style="color: #fff; font-size: 1.1rem; font-weight: 700; margin-bottom: 14px;">Made For You</h3>
      <div style="display: flex; gap: 12px; overflow-x: auto; margin-bottom: 24px;">
        <div style="min-width: 120px; cursor: pointer;" onclick="window.location.href='playlist.html'">
          <img src="../assets/img/covers/small_cover.png" alt="" style="width: 120px; height: 120px; border-radius: 6px; object-fit: cover; margin-bottom: 6px;">
          <p style="color: #fff; font-size: 0.75rem; font-weight: 600;">Daan Mix</p>
          <p style="color: #b3b3b3; font-size: 0.65rem;">Daft Punk...</p>
        </div>
      </div>

    </div>

    <!-- Mobile Navigation Bar -->
    <nav style="position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background-color: rgba(18, 18, 18, 0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;">
      <a href="mobile-home.html" style="display: flex; flex-direction: column; align-items: center; color: #fff; text-decoration: none; font-size: 0.65rem; gap: 4px;">
        <span style="font-size: 1.2rem;">🏠</span><span>Home</span>
      </a>
      <a href="discover.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.65rem; gap: 4px;">
        <span style="font-size: 1.2rem;">🧭</span><span>Discover</span>
      </a>
      <a href="search.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.65rem; gap: 4px;">
        <span style="font-size: 1.2rem;">🔍</span><span>Search</span>
      </a>
      <a href="library.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.65rem; gap: 4px;">
        <span style="font-size: 1.2rem;">📚</span><span>Library</span>
      </a>
    </nav>

  </div>

</body>
</html>
