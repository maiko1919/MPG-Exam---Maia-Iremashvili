<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Mobile - Search (Light/Dark Mode)</title>
  <link rel="icon" href="../assets/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../assets/styles/style.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Light Mode Variables */
    :root {
      --bg-phone: #ffffff;
      --text-main: #000000;
      --text-muted: #535353;
      --card-bg: #f2f2f2;
      --player-bg: #e0e0e0;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --border-color: rgba(0, 0, 0, 0.08);
      --filter-invert: 0;
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-phone: #121212;
        --text-main: #ffffff;
        --text-muted: #b3b3b3;
        --card-bg: #242424;
        --player-bg: #2b233c;
        --nav-bg: rgba(18, 18, 18, 0.98);
        --border-color: rgba(255, 255, 255, 0.08);
        --filter-invert: 1;
      }
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      background-color: var(--bg-phone);
      color: var(--text-main);
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 8px solid #282828;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>
<body>

  <!-- Smartphone Frame -->
  <div class="phone-frame">

    <!-- Scrollable Content -->
    <div class="no-scrollbar" style="flex-grow: 1; overflow-y: auto; padding: 16px; padding-bottom: 130px;">
      
      <!-- Mobile Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #1db954, #1ed760); display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 0.85rem; cursor: pointer;">J</div>
        <h2 style="color: var(--text-main); font-size: 1.2rem; font-weight: 700; margin: 0;">Search</h2>
        <span style="color: var(--text-main); font-size: 1.2rem; cursor: pointer;">📷</span>
      </div>

      <!-- Search Input Bar with Photo/Camera Icon -->
      <div style="background-color: var(--card-bg); border-radius: 4px; display: flex; align-items: center; padding: 10px 14px; gap: 10px; margin-bottom: 20px;">
        <span style="color: var(--text-muted); font-size: 1rem;">🔍</span>
        <input type="text" placeholder="What do you want to play?" style="border: none; outline: none; width: 100%; font-size: 0.9rem; background: transparent; color: var(--text-main); font-weight: 600;">
        <span style="color: var(--text-main); font-size: 1.1rem; cursor: pointer;" title="Search by Photo">📷</span>
      </div>

      <!-- Browse All Title -->
      <h3 style="color: var(--text-main); font-size: 1rem; font-weight: 700; margin-bottom: 14px;">Browse all</h3>
      <h3 style="color: var(--text-main); font-size: 1rem; font-weight: 400; margin-bottom: 14px;">Discover</h3>


      <!-- Discover Cards Grid with Thumbnail Images -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
        
        <!-- Card 1 -->
        <div style="background: linear-gradient(135deg, #283350, #151d3b); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Made For<br>You</span>
          <img src="../assets/img/covers/small_cover.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 2 -->
        <div style="background: linear-gradient(135deg, #d35400, #b9770e); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">New<br>Releases</span>
          <img src="../assets/img/albums/album_1.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 3 -->
        <div style="background: linear-gradient(135deg, #16a085, #117864); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Spotify<br>Classics</span>
          <img src="../assets/img/albums/album_2.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 4 -->
        <div style="background: linear-gradient(135deg, #8e44ad, #5b2c6f); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Charts</span>
          <img src="../assets/img/albums/album_3.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 5 -->
        <div style="background: linear-gradient(135deg, #c0392b, #922b21); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Trending</span>
          <img src="../assets/img/albums/album_4.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 6 -->
        <div style="background: linear-gradient(135deg, #2980b9, #1b4f72); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Discover</span>
          <img src="../assets/img/albums/album_13.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 7 -->
        <div style="background: linear-gradient(135deg, #34495e, #2c3e50); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Spotify<br>Singles</span>
          <img src="../assets/img/artists/artist_1.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

        <!-- Card 8 -->
        <div style="background: linear-gradient(135deg, #d68910, #b9770e); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block; position: relative; z-index: 2;">Decades</span>
          <img src="../assets/img/covers/small_cover.png" alt="" style="position: absolute; right: -10px; bottom: -10px; width: 55px; height: 55px; border-radius: 4px; object-fit: cover; transform: rotate(25deg); box-shadow: -5px -5px 15px rgba(0,0,0,0.4);">
        </div>

      </div>

    </div>

    <!-- Mini Player Bar -->
    <div style="position: absolute; bottom: 70px; left: 8px; right: 8px; background-color: var(--player-bg); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; z-index: 99; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
      <img src="../assets/img/covers/small_cover.png" alt="" style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover;">
      <div style="flex-grow: 1; overflow: hidden;">
        <div style="color: var(--text-main); font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Get Lucky (feat. Pharrell Willia...</div>
        <div style="color: var(--text-muted); font-size: 0.65rem;">Daft Punk</div>
      </div>
      <span style="color: var(--text-main); font-size: 1.1rem; cursor: pointer;">➕</span>
      <span style="color: var(--text-main); font-size: 1.2rem; cursor: pointer; margin-right: 4px;">▶</span>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav style="position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background-color: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-color); z-index: 100;">
      
      <a href="mobile-home.html" style="display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <img src="../assets/img/icons/home.svg" alt="Home" style="width: 22px; height: 22px; opacity: 0.6; filter: invert(var(--filter-invert));">
        <span>Home</span>
      </a>

      <a href="discover.html" style="display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <img src="../assets/img/icons/discover.svg" alt="Discover" style="width: 22px; height: 22px; opacity: 0.6; filter: invert(var(--filter-invert));">
        <span>Discover</span>
      </a>

      <a href="mobile-search.html" style="display: flex; flex-direction: column; align-items: center; color: var(--text-main); text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <img src="../assets/img/icons/search.svg" alt="Search" style="width: 22px; height: 22px; filter: invert(var(--filter-invert));">
        <span style="font-weight: 600;">Search</span>
      </a>

      <a href="library.html" style="display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <img src="../assets/img/icons/library.svg" alt="Library" style="width: 22px; height: 22px; opacity: 0.6; filter: invert(var(--filter-invert));">
        <span>Library</span>
      </a>

      <a href="artist.html" style="display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <img src="../assets/img/icons/artists.svg" alt="Me" style="width: 22px; height: 22px; opacity: 0.6; filter: invert(var(--filter-invert));">
        <span>Me</span>
      </a>

    </nav>

  </div>

</body>
</html>
