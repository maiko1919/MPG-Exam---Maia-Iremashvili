<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Mobile - Search</title>
  <link rel="icon" href="../assets/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../assets/styles/style.css">
</head>
<body style="background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <div style="width: 390px; height: 844px; background-color: #121212; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 8px solid #282828; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">

    <!-- Scrollable Content -->
    <div style="flex-grow: 1; overflow-y: auto; padding: 16px; padding-bottom: 110px;">
      
      <!-- Search Input Bar -->
      <div style="background-color: #fff; border-radius: 4px; display: flex; align-items: center; padding: 10px 14px; gap: 10px; margin-bottom: 20px;">
        <span style="color: #000; font-size: 1rem;">🔍</span>
        <input type="text" placeholder="What do you want to play?" style="border: none; outline: none; width: 100%; font-size: 0.9rem; background: transparent; color: #000; font-weight: 600;">
        <span style="color: #000; font-size: 1.1rem;">📷</span>
      </div>

      <!-- Browse All Title -->
      <h2 style="color: #fff; font-size: 1rem; font-weight: 700; margin-bottom: 14px;">Browse all</h2>

      <!-- Discover Cards Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
        
        <!-- Card 1 -->
        <div style="background: linear-gradient(135deg, #283350, #151d3b); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Made For<br>You</span>
        </div>

        <!-- Card 2 -->
        <div style="background: linear-gradient(135deg, #d35400, #b9770e); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">New<br>Releases</span>
        </div>

        <!-- Card 3 -->
        <div style="background: linear-gradient(135deg, #16a085, #117864); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Spotify<br>Classics</span>
        </div>

        <!-- Card 4 -->
        <div style="background: linear-gradient(135deg, #8e44ad, #5b2c6f); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Charts</span>
        </div>

        <!-- Card 5 -->
        <div style="background: linear-gradient(135deg, #c0392b, #922b21); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Trending</span>
        </div>

        <!-- Card 6 -->
        <div style="background: linear-gradient(135deg, #2980b9, #1b4f72); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Discover</span>
        </div>

        <!-- Card 7 -->
        <div style="background: linear-gradient(135deg, #34495e, #2c3e50); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Spotify<br>Singles</span>
        </div>

        <!-- Card 8 -->
        <div style="background: linear-gradient(135deg, #d68910, #b9770e); height: 90px; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; cursor: pointer;">
          <span style="color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1.1; display: block;">Decades</span>
        </div>

      </div>

    </div>

    <!-- Mini Player Bar -->
    <div style="position: absolute; bottom: 70px; left: 8px; right: 8px; background-color: #282136; border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; z-index: 99;">
      <img src="../assets/img/covers/small_cover.png" alt="" style="width: 36px; height: 36px; border-radius: 4px; object-fit: cover;">
      <div style="flex-grow: 1; overflow: hidden;">
        <div style="color: #fff; font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Get Lucky (feat. Pharrell Williams)</div>
        <div style="color: #b3b3b3; font-size: 0.65rem;">Daft Punk</div>
      </div>
      <span style="color: #fff; font-size: 1rem; cursor: pointer;">➕</span>
      <span style="color: #fff; font-size: 1.1rem; cursor: pointer;">▶</span>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav style="position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background-color: rgba(18, 18, 18, 0.98); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;">
      <a href="mobile-home.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <span style="font-size: 1.1rem;">🏠</span><span>Home</span>
      </a>
      <a href="discover.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <span style="font-size: 1.1rem;">🧭</span><span>Discover</span>
      </a>
      <a href="mobile-search.html" style="display: flex; flex-direction: column; align-items: center; color: #fff; text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <span style="font-size: 1.1rem;">🔍</span><span>Search</span>
      </a>
      <a href="library.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <span style="font-size: 1.1rem;">📚</span><span>Library</span>
      </a>
      <a href="artist.html" style="display: flex; flex-direction: column; align-items: center; color: #b3b3b3; text-decoration: none; font-size: 0.6rem; gap: 4px;">
        <span style="font-size: 1.1rem;">👤</span><span>Me</span>
      </a>
    </nav>

  </div>

</body>
</html>
